*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;letter-spacing:-.01em}
.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px 100px}
header{padding:24px 2px 18px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.13em;text-transform:uppercase}.title{font-size:28px;font-weight:800;margin-top:5px}.gear{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:#fff;font-size:18px}
.hero{border-radius:28px;padding:22px;background:linear-gradient(145deg,#18211b,#11151a 55%,#15111a);border:1px solid #29322b;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;right:-80px;top:-80px;border-radius:50%;background:rgba(185,243,106,.10);filter:blur(10px)}
.hero h2{margin:0;font-size:15px}.days{font-size:64px;line-height:.95;font-weight:850;margin:16px 0 4px;letter-spacing:-.06em}.days span{font-size:13px;color:var(--muted);letter-spacing:.08em}.racebar{display:flex;gap:10px;margin-top:20px}.racebar div{flex:1;background:rgba(255,255,255,.05);border-radius:15px;padding:11px 8px}.racebar b{display:block;font-size:16px}.racebar small{color:var(--muted);font-size:10px;text-transform:uppercase}
.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.section h3{font-size:18px;margin:0}.link{font-size:12px;color:var(--green);font-weight:700}
.workout{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:10px;position:relative}.row{display:flex;gap:13px;align-items:center}.icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:#1c2229}.swim .icon{background:rgba(101,183,255,.13)}.bike .icon{background:rgba(185,243,106,.12)}.run .icon{background:rgba(255,173,102,.12)}.strength .icon{background:rgba(181,140,255,.13)}.brick .icon{background:rgba(255,120,168,.13)}.wt{font-weight:800;font-size:15px}.sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}.badge{margin-left:auto;font-size:10px;color:var(--muted);background:#1b2026;padding:6px 8px;border-radius:9px}.done{opacity:.55}.done .wt{text-decoration:line-through}.check{position:absolute;right:14px;bottom:13px;color:var(--green);font-size:12px;font-weight:800}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 4px;text-align:center}.day small{color:var(--muted);font-size:9px}.day strong{display:block;font-size:15px;margin:5px 0 7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin:auto}.dot.off{background:#343b44}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:rgba(12,14,18,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:10}nav button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 14px}nav button.active{color:var(--text)}nav span{font-size:20px}
.view{display:none}.view.active{display:block}
.back{border:0;background:none;color:var(--muted);padding:8px 0;font-weight:700}.detailTitle{font-size:30px;font-weight:850;margin:14px 0}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:18px}.metric b{font-size:22px}.metric small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-top:5px}.complete{width:100%;border:0;border-radius:17px;padding:16px;background:var(--green);color:#0a0d09;font-weight:850;font-size:15px;margin-top:18px}
.progress{height:9px;background:#252b33;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress i{display:block;height:100%;background:var(--green);border-radius:99px}.chart{height:170px;display:flex;align-items:end;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.bar{flex:1;background:linear-gradient(to top,var(--green),#719a3e);border-radius:8px 8px 3px 3px;min-height:12px}.bar small{display:block;transform:translateY(22px);font-size:9px;color:var(--muted);text-align:center}
.calendarRow{display:flex;background:linear-gradient(145deg,#12171d,#0f1317);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;padding:16px 15px!important;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.calendarRow:last-child{border-bottom:0}
.filter{display:flex;gap:7px;overflow:auto;margin:10px 0 18px}.filter button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:8px 12px}.filter button.selected{background:#20272e;color:#fff;border-color:#39434e}
.small{font-size:12px;color:var(--muted);line-height:1.5}.source{margin-top:25px;padding:14px;background:#11151a;border:1px solid var(--line);border-radius:16px;font-size:11px;color:var(--muted)}

      <div class="phaseNav">${defs.map((x,i)=>`<button class="${i===active?'active':''}" onclick="renderPhase(window.phaseDefs,${i})">${x.name}</button>`).join("")}</div>
      <div class="phasePurpose"><div class="phaseSectionTitle">WHAT THIS PHASE IS FOR</div><h2>${d.name === "Base 1" ? "Build consistency." : d.name === "Base 2" ? "Make endurance your default." : d.name === "Build" ? "Turn fitness into 70.3 fitness." : d.name === "Peak" ? "Practise the race before race day." : d.name === "Taper" ? "Arrive fresh, not fitter." : "Execute what you've built."}</h2><p>${d.desc}</p>
        <div class="phaseFocusGrid">${d.focus.map(f=>`<div class="focusCard"><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}</div>
        <div class="phaseMilestone"><b>Phase milestone</b><span>${d.milestone}</span></div>
      </div>
      <div class="phaseWeekList"><div class="phaseSectionTitle">WEEK BY WEEK</div>
        ${weeks.map(w=>`<div class="phaseWeek ${w.week===curWeek()?'current':''}" onclick="showWeek(${w.week})"><div class="phaseWeekNum">${w.week}</div><div><b>Week ${w.week}</b><span>${fmtDate(w.date)} · ${d.name}</span></div><em>›</em></div>`).join("")}
      </div>
    </div>`;
  window.phaseDefs=defs;
}
function curWeek(){
  const today=new Date().toISOString().slice(0,10), x=data.find(a=>a.date>=today); return x?x.week:32;
}
function progress(){
  const sessions=data.filter(x=>x.type!="Rest");
  const done=sessions.filter(x=>x.completed).length;
  const pct=sessions.length?Math.round(done/sessions.length*100):0;
  const completedBy=t=>data.filter(x=>x.type==t&&x.completed).length;
  const totalBy=t=>data.filter(x=>x.type==t).length;
  const phaseNames=["Base 1","Base 2","Build","Peak","Taper","Race Week"];
  const phaseRanges=[[1,6],[7,12],[13,20],[21,27],[28,31],[32]];
  let currentPhase=phaseNames[0], currentRange=phaseRanges[0];
  const today=new Date().toISOString().slice(0,10);
  const current=data.find(x=>x.date>=today) || data[data.length-1];
  if(current){ const wi=current.week; const j=phaseRanges.findIndex(r=>wi>=r[0]&&wi<=r[1]); if(j>=0){currentPhase=phaseNames[j];currentRange=phaseRanges[j];}}
  const phaseSessions=sessions.filter(x=>x.week>=currentRange[0]&&x.week<=currentRange[1]);
  const phaseDone=phaseSessions.filter(x=>x.completed).length;
  const phasePct=phaseSessions.length?Math.round(phaseDone/phaseSessions.length*100):0;
  const next=data.find(x=>x.type!="Rest"&&!x.completed);

  const disc=["Run","Bike","Swim","Strength","Brick"].map(t=>{
    const a=completedBy(t), b=totalBy(t), q=b?Math.round(a/b*100):0;
    return `<div class="discipline"><div class="disciplineTop"><div class="compactIcon ${t.toLowerCase()}">${ICON[t]||"•"}</div><div><b>${t}</b><small>${a} of ${b} sessions</small></div></div><div class="dbar"><i style="width:${q}%"></i></div><div class="dfoot"><span>Complete</span><strong>${q}%</strong></div></div>`;
  }).join("");

  const phases=phaseNames.map((name,j)=>{
    const [a,b]=phaseRanges[j], ps=sessions.filter(x=>x.week>=a&&x.week<=b), pd=ps.filter(x=>x.completed).length;
    return `<div class="timelineRow ${name===currentPhase?'current':''}"><div class="timelineDot"></div><div><b>${name}</b><span>Weeks ${a}${a!==b?`–${b}`:""} · ${pd}/${ps.length} sessions complete</span></div></div>`;
  }).join("");

  document.getElementById("progress").innerHTML=`
    <div class="progressShell">
      <div class="progressHero">
        <div class="progressHeroTop"><div><h1>Progress</h1><p>Your 70.3 journey to Cotswold 113</p></div><div class="progressRing" style="--pct:${pct}%"><div><b>${pct}%</b><span>COMPLETE</span></div></div></div>
        <div class="progressStats">
          <div class="pStat"><b>${done}</b><span>Sessions done</span></div>
          <div class="pStat"><b>${sessions.length-done}</b><span>Remaining</span></div>
          <div class="pStat"><b>32</b><span>Training weeks</span></div>
        </div>
      </div>

      <div class="progressSection">
        <div class="progressSectionTitle">CURRENT PHASE</div>
        <div class="phaseProgress"><div class="phaseRow"><b>${currentPhase}</b><span>${phaseDone}/${phaseSessions.length} sessions</span></div><div class="phaseTrack"><i style="width:${phasePct}%"></i></div><div class="phaseMini"><span>Phase progress</span><strong>${phasePct}%</strong></div></div>
      </div>

      <div class="progressSection">
        <div class="progressSectionTitle">DISCIPLINES</div>
        <div class="disciplineGrid">${disc}</div>
      </div>

      <div class="progressSection">
        <div class="progressSectionTitle">CONSISTENCY</div>
        <div class="streakCard"><div class="streakNumber">${calcStreak()}</div><div><b>Workout streak</b><span>Consecutive completed sessions in your plan</span></div></div>
      </div>

      <div class="progressSection">
        <div class="progressSectionTitle">YOUR JOURNEY</div>
        <div class="timeline">${phases}</div>
      </div>

      ${next?`<div class="progressSection"><div class="progressSectionTitle">NEXT UP</div><div class="nextWorkoutCard" onclick="detail(${data.indexOf(next)})"><div><small>${next.day.toUpperCase()}</small><b>${next.type}</b></div><span>›</span></div></div>`:''}
    </div>`;
}
function calcStreak(){
  let streak=0, started=false;
  for(let i=data.length-1;i>=0;i--){
    if(data[i].type==="Rest") continue;
    if(data[i].completed){ started=true; streak++; continue; }
    if(started) break;
    return 0;
  }
  return streak;
}
function more(){
  const prefs=JSON.parse(localStorage.getItem("triPrefs")||'{"goal":"Complete the 70.3","days":["Tue","Wed","Thu","Fri","Sat","Sun"],"reminders":true}');
  document.getElementById("more").innerHTML=`
  <div class="settingsShell">
    <div class="settingsHero"><div class="settingsEyebrow">YOUR TRAINING</div><h1>Personalise</h1><p>Keep the plan aligned with how you actually want to train. These settings are saved on this iPhone.</p></div>

    <div class="settingsSection">
      <div class="settingsLabel">YOUR GOAL</div>
      <div class="settingCard">
        <div class="choiceGrid">
          ${["Complete the 70.3","Race confidently","Chase a time","Build fitness"].map(x=>`<button class="choice ${prefs.goal===x?'active':''}" onclick="pickGoal(this,'${x.replace(/'/g,"\'")}')">${x}</button>`).join("")}
        </div>
      </div>
    </div>

    <div class="settingsSection">
      <div class="settingsLabel">TRAINING DAYS</div>
      <div class="settingCard">
        <div class="dayChoices">
          ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<button class="dayChoice ${prefs.days.includes(d)?'active':''}" onclick="toggleDay(this,'${d}')">${d}</button>`).join("")}
        </div>
        <div style="font-size:8px;color:#68727d;line-height:1.5;margin-top:11px">Your current programme is built around six training days with Monday as the normal recovery day.</div>
      </div>
    </div>

    <div class="settingsSection">
      <div class="settingsLabel">APP BEHAVIOUR</div>
      <div class="settingCard">
        <div class="settingRow"><div><b>Workout reminders</b><span>Keep future reminder support enabled.</span></div><button class="toggle ${prefs.reminders?'on':''}" onclick="toggleReminder(this)"></button></div>
        <div class="settingRow"><div><b>Activity tracking</b><span>Handled by Strava — this app stays focused on the plan.</span></div><div class="settingValue">STRAVA</div></div>
      </div>
    </div>

    <div class="settingsSection">
      <div class="settingsLabel">RACE</div>
      <div class="settingCard">
        <div class="settingRow"><div><b>Cotswold 113</b><span>Saturday 5 June 2027</span></div><div class="settingValue">70.3</div></div>
        <div class="settingRow"><div><b>Race distance</b><span>1.9 km swim · 90 km bike · 21.1 km run</span></div><div class="settingValue">113 KM</div></div>
        <div class="settingRow"><div><b>Programme start</b><span>Monday 26 October 2026</span></div><div class="settingValue">32 WEEKS</div></div>
      </div>
    </div>

    <button class="saveSettings" onclick="savePrefs()">SAVE PREFERENCES</button>
    <button class="resetSettings" onclick="resetPrefs()">RESET PERSONALISATION</button>
  </div>`;
  window.editPrefs=prefs;
}
function pickGoal(btn,value){document.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));btn.classList.add("active");window.editPrefs.goal=value}
function toggleDay(btn,day){btn.classList.toggle("active");window.editPrefs.days=[...document.querySelectorAll(".dayChoice.active")].map(x=>x.textContent)}
function toggleReminder(btn){btn.classList.toggle("on");window.editPrefs.reminders=btn.classList.contains("on")}
function savePrefs(){localStorage.setItem("triPrefs",JSON.stringify(window.editPrefs));show("more");}
function resetPrefs(){localStorage.removeItem("triPrefs");show("more")}
function detail(i){let x=data[i];if(!x)return;let type=x.type, icon=ICON[type]||ICON.Bike;let dist=(x.detail.match(/\d+(?:\.\d+)?\s*(?:km|m)/i)||['Session'])[0];document.getElementById('detail').innerHTML=`<div class="detailRef"><div class="detailRefHero"><button class="back" onclick="show('calendar')">‹</button><button class="more">•••</button><div class="detailBadge"><div class="dbIcon">${icon}</div><div><h1>${type==='Bike'?'Bike — Endurance':type==='Run'?'Run — Easy':type==='Swim'?'Swim — Technique + Endurance':type}</h1><p>${x.phase} · Week ${x.week}</p></div></div></div><div class="detailBody"><div class="detailStats"><div><b>${dist}</b><span>Distance</span></div><div><b>${type==='Bike'?'2h 10m':type==='Run'?'50m':'45m'}</b><span>Est. Time</span></div><div><b>${type==='Bike'?'Z2':type==='Run'?'Z2':'AEROBIC'}</b><span>Intensity</span></div></div><h2 class="detailH">Session Overview</h2><p class="detailP">Steady endurance work focused on consistent effort, good technique and race-specific habits. Keep the effort controlled and finish feeling like you could do a little more.</p><h2 class="detailH">Workout Details</h2><div class="setRef"><i class="bar"></i><div><b>${type==='Bike'?'10 km':'Warm up'}</b><span>Easy</span></div><div><b>Z1 · 55–65%</b><span>Build into the session</span></div></div><div class="setRef"><i class="bar"></i><div><b>${type==='Bike'?'40 km':dist}</b><span>Endurance</span></div><div><b>Z2 · 65–75%</b><span>Steady conversational pace</span></div></div><div class="setRef"><i class="bar"></i><div><b>${type==='Bike'?'10 km':'Cool down'}</b><span>Moderate</span></div><div><b>Z3 · 75–85%</b><span>Pick up the effort</span></div></div><h2 class="detailH">Notes</h2><ul class="notesRef"><li>Practise race nutrition and hydration</li><li>Keep cadence smooth and controlled</li><li>Focus on steady power, not speed</li></ul><button class="completeRef" onclick="toggleDone(${i})">${x.completed?'✓ Completed':'● Mark as Complete'}</button></div></div>`;show('detail')}
function nextIncomplete(i){
  for(let n=i+1;n<data.length;n++){
    if(data[n].type!=="Rest"&&!data[n].completed) return n;
  }
  return null;
}
function markComplete(i){
  if(!data[i]) return;
  data[i].completed=true;
  save();
  detail(i);
}
function markIncomplete(i){
  if(!data[i]) return;
  data[i].completed=false;
  save();
  detail(i);
}
function toggleDone(i){data[i].completed=!data[i].completed;save();detail(i)}
function historyBack(){show("home")}
function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));let n=document.getElementById("n-"+v);if(n)n.classList.add("active");if(v=="home")home();if(v=="calendar")calendar();if(v=="workouts")workouts();if(v=="progress")progress();if(v=="more")more();if(v=="phases")phases()}
home();calendar();workouts();progress();more();
</script>

<script>
/* Local app resilience — completion/preferences persist locally. True offline asset caching requires a separate service worker file. */
(function(){
  try{
    const key='triPlan';
    if(!localStorage.getItem(key) && typeof data!=='undefined'){
      localStorage.setItem(key,JSON.stringify(data));
    }
  }catch(e){}
  window.addEventListener('online',()=>document.documentElement.classList.remove('offline'));
  window.addEventListener('offline',()=>document.documentElement.classList.add('offline'));
})();
</script>

</body></html>
